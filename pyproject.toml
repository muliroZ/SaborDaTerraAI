[project]
name = "sabor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "muliroZ", email = "murilomega100@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-ai>=2.68.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.67.0",
]

[project.scripts]
sabor = "sabor:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]